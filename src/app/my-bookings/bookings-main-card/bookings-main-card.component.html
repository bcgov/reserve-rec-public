<a [routerLink]="['/account/bookings', bookingId]" class="text-decoration-none text-dark d-block h-100 booking-card-link" [attr.aria-label]="ariaLabel || 'View booking details'">
  <div class="card h-100 booking-card" [class.booking-card-compact]="compact">
    @if (imageUrl) {
      <img [src]="imageUrl" alt="" class="booking-card-image" />
    }
    <div class="p-3 flex-grow-1">
      <div class="mb-1">
        <strong class="text-primary fs-5 booking-card-title">{{ geozoneName }}</strong>
        <i class="fa-solid fa-circle-chevron-right text-primary ms-2"></i>
      </div>
      @if (facilityName) {
        <div class="text-muted mb-3">{{ facilityName }}</div>
      }
      @if (isCancelled) {
        <div class="text-danger mb-2">Cancelled</div>
      }
      <div [class]="{ 'text-muted': isCancelled, 'text-body-emphasis': !isCancelled }">
        <div class="small">
          <strong>{{ activityType }}</strong>
          @if (passType) {
            <span class="booking-card-divider">|</span>{{ passType }}
          }
        </div>
        <div class="small">{{ formattedDate }}</div>
      </div>
    </div>
  </div>
</a>
