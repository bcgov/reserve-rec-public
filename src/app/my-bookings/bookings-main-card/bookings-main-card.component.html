<a [routerLink]="['/account/bookings', bookingId]" class="text-decoration-none text-dark d-block h-100 booking-card-link" [attr.aria-label]="ariaLabel || 'View booking details'">
  <div class="card h-100 p-3 booking-card">
    <div class="mb-1">
      <strong class="text-primary fs-5 booking-card-title">{{ geozoneName }}</strong>
    </div>
    <div class="text-muted mb-3 fs-5">
      {{ facilityName }}
    </div>
    <div class="text-body-emphasis mb-2">
      {{ activityType }}
    </div>
    @if (isCancelled) {
      <div class="text-danger mb-2">Cancelled</div>
    }
    @if (isInProgress) {
      <div class="text-warning mb-2">In progress</div>
    }
    <div [class]="{ 'text-muted': isCancelled || isInProgress, 'text-body-emphasis': !isCancelled && !isInProgress }">
      {{ formattedDate }}
    </div>
  </div>
</a>
