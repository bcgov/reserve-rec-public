<div class="mb-4">
  <div class="mb-3">
    <!-- flex-nowrap prevents steps from wrapping to a new line on mobile -->
    <!-- overflow-hidden prevents text from breaking the layout horizontally -->
    <nav class="nav nav-pills d-flex flex-row flex-nowrap w-auto overflow-hidden justify-content-center">
      @for (step of stepperService.getSteps(); track step; let i = $index) {
        
        <button
          type="button"
          class="nav-link position-relative border-0 bg-transparent rounded-0 px-2 py-3 transition-all"
          style="min-width: 0; flex-grow: 0;"
          [disabled]="!isStepClickable(i)"
          [class.active]="step.isActive"
          [class.completed]="isStepCompletedForCurrentItem(step, i)"
          [class.disabled]="!isStepClickable(i)"
          [class.flex-grow-1]="step.isActive"
          [class.flex-md-fill]="true"
          (click)="isStepClickable(i) && onStepClick(i)"
        >
          <!-- Using Bootstrap gap-2 replaces the need for custom margins between icon and text -->
          <div class="d-flex align-items-center justify-content-start gap-2 px-2">
            
            <!-- Step Number / Icon -->
            <span
              class="d-flex align-items-center justify-content-center flex-shrink-0"
              [class.text-success]="isStepCompletedForCurrentItem(step, i)"
              [class.text-primary]="step.isActive && !isStepCompletedForCurrentItem(step, i)"
              [class.text-secondary]="!step.isActive && !isStepCompletedForCurrentItem(step, i)"
            >
              @if (isStepCompletedForCurrentItem(step, i)) {
                <i class="fa-regular fa-circle-check fs-5 me-2"></i>
              } @else {
                <span class="fw-bold fs-6">{{ i + 1 }}.</span>
              }
            </span>

            <!-- Step Title -->
            <!-- d-none on mobile UNLESS active. d-md-inline forces it to show on desktop ALWAYS -->
            <span
              class="fw-semibold text-truncate d-md-inline"
              [class.d-none]="!step.isActive"
              [class.text-success]="isStepCompletedForCurrentItem(step, i)"
              [class.text-primary]="step.isActive"
              [class.text-secondary]="!step.isActive && !isStepCompletedForCurrentItem(step, i)"
            >
              {{ getStepTitle(step) }}
            </span>
            
          </div>
        </button>
      }
    </nav>
  </div>
</div>
