<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10 px-0">

      <!-- Info Alert -->
      <div class="alert alert-info mb-4 border border-1 border-primary px-4 py-3" role="alert">
        <div class="d-flex">
          <div class="me-2 flex-shrink-0">
            <i class="text-primary fa-regular fa-circle-info"></i>
          </div>
          <div>
            <div class="mb-1">
              <strong class="text-dark">Passes cannot be transferred or changed.</strong>
            </div>
            <div class="text-dark small">Please review your booking details below carefully.</div>
          </div>
        </div>
      </div>

      <app-cart-item [item]="cartItem"></app-cart-item>

      <!-- Acknowledgement Checkbox -->
      <div class="mt-4 mb-4 p-3 border border-1 rounded-1 border-medium-grey bg-light-blue-nav">
        <div class="form-check align-items-center d-flex gap-3 justify-content-start">
          <input
            class="form-check-input"
            type="checkbox"
            [formControl]="$any(form?.get('acknowledgeDetails'))"
            id="acknowledgeDetails"
            >
          <p class="form-check-label m-0" for="acknowledgeDetails">
            I acknowledge that this information is correct and agree to the terms of the booking.
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
