<!-- Stepper-based Reservation Flow Template -->
@if (cartItem) {
  <app-cart-timer (removeItem)="removeItem($event)"></app-cart-timer>
}
<div class="bg-container bg-grey">
  <div class="container">
    <!-- Breadcrumbs -->
    <app-breadcrumb></app-breadcrumb>

    <h1 class="text-primary my-4">Checkout</h1>
    <app-admission-countdown class="mb-3 d-block"></app-admission-countdown>

    <div class="container-fluid bg-white p-lg-4 p-md-4 p-sm-4 px-0">

      <app-progress-indicator
        [totalItems]="1"
        [currentItemIndex]="0"
        [currentItemName]="cartItem?.activityName"
        [queueItems]="cartItems"
        >
      </app-progress-indicator>

      <!-- Step Content Container -->
      <div class="container-fluid bg-grey p-lg-4 p-md-4 p-sm-4 px-0">
        <!-- Single step container with exclusive display logic -->
        @switch (currentStep) {
          <!-- Step 0: Details -->
          @case (0) {
            <div class="step-wrapper fade-in">
              <app-confirm-details-step
                [form]="form"
                [cartItem]="cartItem"
                [bookingSummary]="bookingSummary"
                (stepCompleted)="onStepCompleted($event)"
                (stepValidated)="onStepValidated($event)"
              ></app-confirm-details-step>
            </div>
          }
          <!-- Step 1: Visitor Details -->
          @case (1) {
            <div class="step-wrapper fade-in">
              <app-visitor-details-step
                [form]="form"
                [user]="user"
                [cartItem]="cartItem"
                [bookingSummary]="bookingSummary"
                (stepCompleted)="onStepCompleted($event)"
                (stepValidated)="onStepValidated($event)"
              ></app-visitor-details-step>
            </div>
          }
          <!-- Step 2: Equipment -->
          @case (2) {
            <div class="step-wrapper fade-in">
              <app-equipment-step
                [form]="form"
                [cartItem]="cartItem"
                [bookingSummary]="bookingSummary"
                (stepCompleted)="onStepCompleted($event)"
                (stepValidated)="onStepValidated($event)"
                [user]="user"
              ></app-equipment-step>
            </div>
          }
          <!-- Step 3: Payment (conditionally shown based on feature flag) -->
          @case (3) {
            <div class="step-wrapper fade-in">
              <app-payment-step
                [form]="form"
                [user]="user"
                [cartItem]="cartItem"
                [bookingSummary]="bookingSummary"
                [bookingId]="currentBookingId"
                [sessionId]="currentSessionId"
                (stepCompleted)="onStepCompleted($event)"
                (stepValidated)="onStepValidated($event)"
              ></app-payment-step>
            </div>
          }
          <!-- Fallback for any unexpected state -->
          @default {
            <div class="step-wrapper">
              <div class="alert alert-warning">
                <i class="fa-solid fa-exclamation-triangle me-2"></i>
                Invalid step state. Please refresh the page.
              </div>
            </div>
          }
        }
      </div>
    </div>
  </div>
</div>

<!-- Full Width Navigation Bar -->
<div class="w-100 bg-light-blue-nav border-top fixed-bottom">
  <div class="container">
    <div class="d-flex justify-content-between py-3">
      <!-- Cancel Booking on first step, Back button on subsequent steps -->
      @if (!showBackButton()) {
        <button
          type="button"
          class="btn btn-outline-primary rounded-1"
          (click)="backToCart()"
          >
          <i class="fa-solid fa-circle-chevron-left me-1"></i>
          Back to cart
        </button>
      }

      @if (showBackButton()) {
        <button
          type="button"
          class="btn btn-outline-secondary rounded-1"
          (click)="goBack()"
          >
          <i class="fa-solid fa-chevron-left me-2"></i>
          {{ getBackButtonLabel() }}
        </button>
      }

      <button
        type="button"
        class="btn btn-primary rounded-1"
        [class.bg-disabled]="!canProceed() || isSubmitting"
        [class.text-disabled]="!canProceed() || isSubmitting"
        [class.border-disabled]="!canProceed() || isSubmitting"
        [disabled]="!canProceed() || isSubmitting"
        (click)="proceedToNext()"
        >
        @if (isSubmitting) {
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        }
        {{ isSubmitting ? 'Processing…' : getNextButtonLabel() }}
      </button>
    </div>
  </div>
</div>
