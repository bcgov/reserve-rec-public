<div class="account-info border rounded px-3 py-4 bg-booking-header">
  <div class="row g-4">
    <div class="col-lg-6">
      <p class="info-label fw-bold mb-2">Name</p>
      <p class="info-value mb-0">{{ info.fullName }}</p>
    </div>
    <div class="col-lg-6">
      <p class="info-label fw-bold mb-2">Email address</p>
      <p class="info-value mb-0">{{ info.email }}</p>
    </div>
  </div>

  <div class="row g-4 mt-0">
    <div class="col-lg-6">
      <p class="info-label fw-bold mb-2">Home address</p>
      @for (line of info.addressLines; track $index) {
        <p class="info-value mb-0">{{ line }}</p>
      }
    </div>
    <div class="col-lg-6">
      <p class="info-label fw-bold mb-2">{{ info.phoneHeading }}</p>
      <div class="phone-container d-flex flex-column">
        @for (phone of info.phones; track $index) {
          <div class="d-flex justify-content-between flex-wrap" [class.mb-1]="$index < info.phones.length - 1">
            @if (phone.label) {
              <p class="phone-label info-value mb-0 text-muted">{{ phone.label }}:</p>
            }
            <p class="phone-value text-dark mb-0">{{ phone.value }}</p>
          </div>
        }
      </div>
    </div>
  </div>
</div>
